services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspirarte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-inspirarte}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inspirarte}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-inspirarte}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      PORT: 8080
    expose:
      - "8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:?required}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
