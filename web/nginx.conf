server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Evita Location: http://localhost/admin/ (sin :3000) cuando el
  # contenedor escucha en 80 y Docker publica 3000→80.
  absolute_redirect off;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Cacheo agresivo para assets con hash de Astro
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
