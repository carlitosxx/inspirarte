services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inspirarte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspirarte}
      POSTGRES_DB: ${POSTGRES_DB:-inspirarte}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspirarte}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://inspirarte:inspirarte@db:5432/inspirarte?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambialo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inspirarte.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
